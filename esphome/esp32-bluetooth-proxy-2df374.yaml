substitutions:
  name: esp32-bluetooth-proxy-2df374
  friendly_name: Christmas C9 Controller

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Fixes the WARNING: BLE components require 4 connection slot(s)
esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

ble_client:
  - id: c9_lights
    mac_address: !secret c9_lights_mac_address
    auto_connect: false

api:
  encryption:
    key: !secret esphome_api_encryption_key
  services:
    - service: send_command
      variables:
        payload: int[]
      then:
        - ble_client.connect: c9_lights
        - delay: 800ms
        - ble_client.ble_write:
            id: c9_lights
            service_uuid: "49535343-FE7D-4AE5-8FA9-9FAFD205E455"
            characteristic_uuid: "49535343-8841-43F4-A8D4-ECBE34729BB3"
            # Fixes the ERROR: Converts standard integers to 8-bit unsigned bytes
            value: !lambda |-
              std::vector<uint8_t> bytes(payload.begin(), payload.end());
              return bytes;
        - delay: 500ms
        - ble_client.disconnect: c9_lights

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
